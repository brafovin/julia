<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Spiel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    /* ─── SCREENS ─── */
    .screen { display: none; flex-direction: column; align-items: center; gap: 24px; }
    .screen.active { display: flex; }

    /* ─── START SCREEN ─── */
    #start-screen h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      background: linear-gradient(135deg, #e94560, #f5a623);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
      letter-spacing: 2px;
    }
    #start-screen p { color: #aaa; font-size: 1.1rem; }

    .level-cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .level-btn {
      background: rgba(255,255,255,0.05);
      border: 2px solid transparent;
      border-radius: 20px;
      padding: 28px 36px;
      cursor: pointer;
      transition: all .3s;
      text-align: center;
      min-width: 160px;
      color: #fff;
    }
    .level-btn:hover { transform: translateY(-6px); }
    .level-btn.easy   { border-color: #4caf50; }
    .level-btn.medium { border-color: #ff9800; }
    .level-btn.hard   { border-color: #e94560; }
    .level-btn.easy:hover   { background: rgba(76,175,80,0.2); box-shadow: 0 0 20px rgba(76,175,80,0.4); }
    .level-btn.medium:hover { background: rgba(255,152,0,0.2); box-shadow: 0 0 20px rgba(255,152,0,0.4); }
    .level-btn.hard:hover   { background: rgba(233,69,96,0.2); box-shadow: 0 0 20px rgba(233,69,96,0.4); }

    .level-btn .icon  { font-size: 2.4rem; margin-bottom: 8px; }
    .level-btn .name  { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
    .level-btn .info  { font-size: .85rem; color: #aaa; }

    /* ─── GAME SCREEN ─── */
    #game-screen { width: 100%; padding: 20px; max-width: 900px; }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .game-title {
      font-size: 1.4rem;
      font-weight: 700;
    }
    .game-title span { opacity: .6; font-weight: 400; font-size: 1rem; }

    .stats {
      display: flex;
      gap: 20px;
    }
    .stat {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 8px 18px;
      text-align: center;
    }
    .stat .label { font-size: .7rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .stat .value { font-size: 1.3rem; font-weight: 700; }

    #btn-menu {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 8px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: .9rem;
      transition: background .2s;
    }
    #btn-menu:hover { background: rgba(255,255,255,0.15); }

    /* ─── GRID ─── */
    .card-grid {
      display: grid;
      gap: 12px;
      justify-content: center;
      width: 100%;
    }

    /* ─── CARD ─── */
    .card {
      perspective: 800px;
      cursor: pointer;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform .45s cubic-bezier(.4,0,.2,1);
    }
    .card.flipped .card-inner,
    .card.matched .card-inner { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      width: 100%; height: 100%;
      border-radius: 14px;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      user-select: none;
    }
    .card-back {
      background: linear-gradient(135deg, #1e3a5f, #0f3460);
      border: 2px solid rgba(255,255,255,0.1);
      font-size: 1.6rem;
    }
    .card-back::after {
      content: '❓';
    }
    .card-front {
      background: linear-gradient(135deg, #16213e, #1a1a2e);
      border: 2px solid rgba(255,255,255,0.15);
      transform: rotateY(180deg);
    }
    .card.matched .card-front {
      border-color: #4caf50;
      box-shadow: 0 0 16px rgba(76,175,80,0.5);
      animation: matchPop .35s ease;
    }

    @keyframes matchPop {
      0%   { transform: rotateY(180deg) scale(1); }
      50%  { transform: rotateY(180deg) scale(1.12); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    /* ─── WIN SCREEN ─── */
    #win-screen { text-align: center; }
    #win-screen h2 {
      font-size: clamp(2rem, 5vw, 3rem);
      background: linear-gradient(135deg, #4caf50, #8bc34a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #win-screen p { color: #aaa; font-size: 1.1rem; }

    .win-stats {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .win-stat {
      background: rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 20px 30px;
      min-width: 120px;
    }
    .win-stat .wlabel { font-size: .75rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .win-stat .wvalue { font-size: 2rem; font-weight: 700; margin-top: 4px; }

    .win-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

    .btn-primary, .btn-secondary {
      padding: 14px 32px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .25s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #e94560, #f5a623);
      color: #fff;
    }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(233,69,96,0.4); }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); }

    /* ─── PROGRESS BAR ─── */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4caf50, #8bc34a);
      border-radius: 99px;
      transition: width .5s ease;
    }

    /* ─── CONFETTI ─── */
    .confetti-container {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      top: -20px;
      width: 10px; height: 10px;
      border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    @media (max-width: 480px) {
      .level-cards { flex-direction: column; }
      .stats { gap: 10px; }
    }
  </style>
</head>
<body>

<!-- ═══ START SCREEN ═══ -->
<div id="start-screen" class="screen active">
  <h1>🃏 Memory</h1>
  <p>Wähle deinen Schwierigkeitsgrad</p>
  <div class="level-cards">
    <button class="level-btn easy"   data-level="1">
      <div class="icon">😊</div>
      <div class="name">Einfach</div>
      <div class="info">12 Karten · 6 Paare</div>
    </button>
    <button class="level-btn medium" data-level="2">
      <div class="icon">🤔</div>
      <div class="name">Mittel</div>
      <div class="info">20 Karten · 10 Paare</div>
    </button>
    <button class="level-btn hard"   data-level="3">
      <div class="icon">🔥</div>
      <div class="name">Schwer</div>
      <div class="info">30 Karten · 15 Paare</div>
    </button>
  </div>
</div>

<!-- ═══ GAME SCREEN ═══ -->
<div id="game-screen" class="screen">
  <div class="game-header">
    <div>
      <div class="game-title" id="game-title">Memory</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="label">Züge</div>
        <div class="value" id="moves-counter">0</div>
      </div>
      <div class="stat">
        <div class="label">Zeit</div>
        <div class="value" id="timer">0:00</div>
      </div>
      <div class="stat">
        <div class="label">Paare</div>
        <div class="value" id="pairs-counter">0 / 0</div>
      </div>
    </div>
    <button id="btn-menu">↩ Menü</button>
  </div>
  <div class="card-grid" id="card-grid"></div>
</div>

<!-- ═══ WIN SCREEN ═══ -->
<div id="win-screen" class="screen">
  <div style="font-size:4rem">🎉</div>
  <h2>Gewonnen!</h2>
  <p id="win-msg">Fantastisch!</p>
  <div class="win-stats">
    <div class="win-stat">
      <div class="wlabel">Züge</div>
      <div class="wvalue" id="win-moves">0</div>
    </div>
    <div class="win-stat">
      <div class="wlabel">Zeit</div>
      <div class="wvalue" id="win-time">0:00</div>
    </div>
    <div class="win-stat">
      <div class="wlabel">Sterne</div>
      <div class="wvalue" id="win-stars">⭐⭐⭐</div>
    </div>
  </div>
  <div class="win-actions">
    <button class="btn-primary"   id="btn-retry">Nochmal spielen</button>
    <button class="btn-secondary" id="btn-next-level">Nächstes Level ›</button>
    <button class="btn-secondary" id="btn-home">Hauptmenü</button>
  </div>
</div>

<div class="confetti-container" id="confetti"></div>

<script>
// ─── EMOJI POOL ───────────────────────────────────────────────────────────────
const EMOJIS = [
  '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼',
  '🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔',
  '🦄','🦋','🐙','🦑','🦈','🐬','🦖','🌈',
  '🍕','🍦','🎸','🚀','⚽','🎮','🏆','💎',
];

// ─── LEVEL CONFIG ─────────────────────────────────────────────────────────────
const LEVELS = {
  1: { name: 'Einfach 😊', pairs: 6,  cols: 4, starMoves: [10, 16, 999] },
  2: { name: 'Mittel 🤔',  pairs: 10, cols: 5, starMoves: [18, 28, 999] },
  3: { name: 'Schwer 🔥',  pairs: 15, cols: 6, starMoves: [28, 42, 999] },
};

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = {
  level: 1,
  cards: [],
  flipped: [],
  matched: 0,
  moves: 0,
  seconds: 0,
  timer: null,
  locked: false,
};

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function formatTime(s) {
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

function calcStars(moves, level) {
  const [s3, s2] = LEVELS[level].starMoves;
  if (moves <= s3) return '⭐⭐⭐';
  if (moves <= s2) return '⭐⭐';
  return '⭐';
}

// ─── GAME INIT ────────────────────────────────────────────────────────────────
function startGame(level) {
  clearInterval(state.timer);
  state = { level, cards: [], flipped: [], matched: 0, moves: 0, seconds: 0, timer: null, locked: false };

  const cfg = LEVELS[level];
  $('game-title').textContent = `Level ${level} – ${cfg.name}`;

  // build card data
  const pool = shuffle([...EMOJIS]).slice(0, cfg.pairs);
  const deck = shuffle([...pool, ...pool].map((emoji, i) => ({ id: i, emoji, symbol: emoji })));
  state.cards = deck;

  // grid columns
  const grid = $('card-grid');
  grid.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;

  // card size based on cols & pairs
  const cardSize = cfg.cols <= 4 ? '90px' : cfg.cols <= 5 ? '80px' : '72px';
  grid.style.gridAutoRows = cardSize;

  // adjust on small screens
  const colSize = `min(${cardSize}, calc((100vw - ${(cfg.cols+1)*12+40}px) / ${cfg.cols}))`;
  grid.style.gridTemplateColumns = `repeat(${cfg.cols}, ${colSize})`;

  // render cards
  grid.innerHTML = '';
  deck.forEach(card => {
    const el = document.createElement('div');
    el.className = 'card';
    el.dataset.id = card.id;
    el.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back"></div>
        <div class="card-face card-front">${card.emoji}</div>
      </div>`;
    el.addEventListener('click', () => onCardClick(el, card));
    grid.appendChild(el);
  });

  updateStats();
  $('progress-fill').style.width = '0%';

  // start timer
  state.timer = setInterval(() => {
    state.seconds++;
    $('timer').textContent = formatTime(state.seconds);
  }, 1000);

  showScreen('game-screen');
}

// ─── CARD CLICK ───────────────────────────────────────────────────────────────
function onCardClick(el, card) {
  if (state.locked) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;

  el.classList.add('flipped');
  state.flipped.push({ el, card });

  if (state.flipped.length === 2) {
    state.locked = true;
    state.moves++;
    updateStats();

    const [a, b] = state.flipped;
    if (a.card.emoji === b.card.emoji) {
      // Match!
      setTimeout(() => {
        a.el.classList.add('matched');
        b.el.classList.add('matched');
        state.flipped = [];
        state.matched++;
        state.locked = false;
        updateProgress();
        if (state.matched === LEVELS[state.level].pairs) onWin();
      }, 400);
    } else {
      // No match
      setTimeout(() => {
        a.el.classList.remove('flipped');
        b.el.classList.remove('flipped');
        state.flipped = [];
        state.locked = false;
      }, 900);
    }
  }
}

// ─── UI UPDATES ───────────────────────────────────────────────────────────────
function updateStats() {
  $('moves-counter').textContent = state.moves;
  $('timer').textContent = formatTime(state.seconds);
  $('pairs-counter').textContent = `${state.matched} / ${LEVELS[state.level].pairs}`;
}

function updateProgress() {
  const pct = (state.matched / LEVELS[state.level].pairs) * 100;
  $('progress-fill').style.width = pct + '%';
  $('pairs-counter').textContent = `${state.matched} / ${LEVELS[state.level].pairs}`;
}

// ─── WIN ──────────────────────────────────────────────────────────────────────
function onWin() {
  clearInterval(state.timer);
  const stars = calcStars(state.moves, state.level);
  const msgs = ['Klasse gemacht! 🎊', 'Super gespielt! 🏆', 'Unglaublich! 🔥'];

  $('win-moves').textContent = state.moves;
  $('win-time').textContent = formatTime(state.seconds);
  $('win-stars').textContent = stars;
  $('win-msg').textContent = msgs[state.level - 1];

  const hasNext = state.level < 3;
  $('btn-next-level').style.display = hasNext ? '' : 'none';

  spawnConfetti();
  setTimeout(() => showScreen('win-screen'), 600);
}

// ─── CONFETTI ─────────────────────────────────────────────────────────────────
function spawnConfetti() {
  const container = $('confetti');
  container.innerHTML = '';
  const colors = ['#e94560','#f5a623','#4caf50','#2196f3','#9c27b0','#fff'];
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.width  = (6 + Math.random() * 10) + 'px';
    p.style.height = (6 + Math.random() * 10) + 'px';
    p.style.animationDuration = (1.5 + Math.random() * 2.5) + 's';
    p.style.animationDelay   = (Math.random() * 0.8) + 's';
    container.appendChild(p);
  }
  setTimeout(() => container.innerHTML = '', 5000);
}

// ─── BUTTON LISTENERS ─────────────────────────────────────────────────────────
document.querySelectorAll('.level-btn').forEach(btn => {
  btn.addEventListener('click', () => startGame(Number(btn.dataset.level)));
});

$('btn-menu').addEventListener('click', () => {
  clearInterval(state.timer);
  showScreen('start-screen');
});

$('btn-retry').addEventListener('click', () => startGame(state.level));

$('btn-next-level').addEventListener('click', () => {
  if (state.level < 3) startGame(state.level + 1);
});

$('btn-home').addEventListener('click', () => showScreen('start-screen'));
</script>
</body>
</html>
